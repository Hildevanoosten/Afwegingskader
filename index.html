function getTotaal(scores) {
return Object.values(scores).reduce((s, v) => s + (v || 0), 0);
}
function getAdvies(totaal) {
if (totaal >= 24) return { label: "Actief inzetten", dot: "#276749", bg: "#f0fff4", border: "#9ae6b4", textCol: "#276749" };
if (totaal >= 18) return { label: "Voorwaardelijk inzetten", dot: "#b7791f", bg: "#fffff0", border: "#f6e05e", textCol: "#744210" };
if (totaal >= 12) return { label: "Pilot of experiment", dot: "#c05621", bg: "#fffaf0", border: "#fbd38d", textCol: "#7b341e" };
return { label: "Niet inzetten", dot: "#c53030", bg: "#fff5f5", border: "#feb2b2", textCol: "#742a2a" };
}

const sterke = CRITERIA.filter(c => (scores[c.id] || 0) >= 4);
const zwakke = CRITERIA.filter(c => (scores[c.id] || 0) <= 2);
const adv = getAdvies(totaal);
let t = `Op basis van de Multi Criteria Analyse scoort ${naam} ${totaal} van de maximaal 30 punten — advies: ${adv.label}. `;
if (totaal >= 24) t += `Het platform kan worden ingezet als structureel communicatiekanaal, mits kerninformatie altijd ook via eigen kanalen (gemeentelijke website, nieuwsbrief) beschikbaar is.`;
else if (totaal >= 18) t += `Inzet is mogelijk onder specifieke voorwaarden. Adresseer de aandachtspunten voordat het platform breed wordt ingezet en monitor periodiek of inzet nog aansluit bij de publieke opdracht.`;
else if (totaal >= 12) t += `Overweeg een beperkte pilot voor één specifiek communicatiedoel. Evalueer streng en leg bevindingen vast.`;
else t += `De risico's en beperkingen wegen zwaarder dan de potentiële voordelen. Een negatief besluit is traceerbaar te onderbouwen met dit kader.`;
if (sterke.length > 0) t += ` Sterke punten: ${sterke.map(c => c.title).join(", ")}.`;
if (zwakke.length > 0) t += ` Aandacht nodig voor: ${zwakke.map(c => c.title).join(", ")}.`;
return t;
}

function RadarChart({ scores, size = 240 }) {
const cx = size / 2, cy = size / 2, r = size * 0.36;
const n = CRITERIA.length;
const angles = CRITERIA.map((_, i) => (2 * Math.PI * i) / n - Math.PI / 2);
const pt = (score, i) => { const f = (score || 0) / 5; return [cx + r * f * Math.cos(angles[i]), cy + r * f * Math.sin(angles[i])]; };
const grid = f => angles.map(a => [cx + r * f * Math.cos(a), cy + r * f * Math.sin(a)]);
const poly = pts => pts.map(p => p.join(",")).join(" ");
const dataPoints = CRITERIA.map((c, i) => pt(scores[c.id] || 0, i));
return (
<svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ display: "block", margin: "0 auto" }}>
{[1,2,3,4,5].map(l => <polygon key={l} points={poly(grid(l/5))} fill={l===5 ? T.accentBg : "none"} stroke={T.borderDark} strokeWidth="1" />)}
{angles.map((a, i) => <line key={i} x1={cx} y1={cy} x2={cx+r*Math.cos(a)} y2={cy+r*Math.sin(a)} stroke={T.borderDark} strokeWidth="1" />)}
<polygon points={poly(dataPoints)} fill="rgba(30,58,95,0.12)" stroke={T.accent} strokeWidth="2" />
{dataPoints.map((p, i) => <circle key={i} cx={p[0]} cy={p[1]} r="4" fill={T.accent} />)}
{CRITERIA.map((c, i) => {
const lx = cx + (r+22)*Math.cos(angles[i]);
const ly = cy + (r+22)*Math.sin(angles[i]);
const anchor = Math.cos(angles[i]) < -0.1 ? "end" : Math.cos(angles[i]) > 0.1 ? "start" : "middle";
return <text key={i} x={lx} y={ly+4} textAnchor={anchor} fontSize="10" fill={T.slateMid} fontFamily="Georgia, serif">{c.short}</text>;
})}
</svg>
);
}
function ScoreBar({ score }) {
const col = score <= 2 ? "#c53030" : score <= 3 ? "#b7791f" : "#276749";
return (
<div style={{ display: "flex", alignItems: "center", gap: 10 }}>
<div style={{ flex: 1, height: 5, background: T.bgAlt, borderRadius: 3, overflow: "hidden" }}>
<div style={{ width: `${(score/5)*100}%`, height: "100%", background: col, borderRadius: 3, transition: "width 0.4s ease" }} />
</div>
<span style={{ fontWeight: 700, fontSize: 13, color: col, minWidth: 28, textAlign: "right" }}>{score}/5</span>
</div>
);
}
